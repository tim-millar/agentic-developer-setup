assessor_context:
  status: not_provided
assumptions:
- Static inspection is limited to recognised repository metadata and documentation;
  arbitrary source code is not analysed.
- Existing repository-native mechanisms are treated as capability evidence, not as
  framework provenance.
unknowns:
- Static evidence cannot prove that a documented command succeeds or that an unobserved
  area does not exist.
- Repository semantics, ownership, security posture, and operational suitability require
  human review.
- The assessment does not recursively assess each project root in a multi-project
  repository.
- No assessor context was supplied for facts that are not discoverable from repository
  files.
