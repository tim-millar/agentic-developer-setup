[build-system]
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[project]
name = "reference-service"
version = "0.1.0"
description = "A small task registry used as a framework adoption fixture."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tests"]
